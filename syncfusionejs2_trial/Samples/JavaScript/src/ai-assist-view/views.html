<div class="control-section">
    <div class="views-container"> 
        <div id="aiAssist_views"></div>
    </div>
</div>
<style>
    .custom-footer {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .views-container {
        height: 225px;
        width: 50%;
        margin: 25px auto;
    }

    .e-aiassist-view .e-aiassist-footer .e-multi-line-input {
        margin: 0;
    }

    .views-container #custom-view {
        width: 86%;
        margin: 18px auto 5px;
    }

    .custom-view-container {
        margin: 10px;
        border-radius: 4px;
        border: 1px solid #d1d1d1;
    }
    .prompt-header {
        padding: 10px;
        border-bottom: 1px solid #d1d1d1;
    }

    .prompt-response {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .prompt-response button {
        width: max-content;
    }
    .custom-view-container {
        display: flex;
        flex-direction: column;
    }
    .response-text {
        margin-bottom: 5px;
        font-size: 14px;
    }
    @media (max-width: 750px) {
        .custom-footer {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .generate-btn {
            align-self: auto;
        }
    }
    body[class*="-dark"] .custom-view-container {
        border: 1px solid #4a4a4a;
    }
    body[class*="-dark"] .prompt-header {
        border-bottom: 1px solid #4a4a4a;
    }
</style>

<div id="action-description">
    <p>This sample showcases the AIAssistView component different views.</p>
</div>
<div id="description">
    <p></p>
</div>
