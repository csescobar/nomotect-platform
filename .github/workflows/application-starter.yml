name: Application Starter

on:
  pull_request:
    paths:
      - .github/workflows/application-starter.yml
      - bin/application-starter-build
      - bin/nomotect-init*
      - config/distributions/application_starter.yml
      - lib/application_starter.rb
      - test/lib/application_starter_test.rb
      - Gemfile
      - Gemfile.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/application-starter.yml
      - bin/application-starter-build
      - bin/nomotect-init*
      - config/distributions/application_starter.yml
      - lib/application_starter.rb
      - test/lib/application_starter_test.rb
      - Gemfile
      - Gemfile.lock

permissions:
  contents: read

jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      STARTER_OUTPUT: ${{ runner.temp }}/nomotect-starter
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build TAR.GZ and ZIP distributions
        run: ruby bin/application-starter-build --version 0.9.0 --source-commit ${{ github.sha }} --output "${{ env.STARTER_OUTPUT }}"
      - name: Extract the platform-neutral ZIP
        run: ruby -rzip -e "Zip::File.open(File.join(ENV.fetch('STARTER_OUTPUT'), 'nomotect-starter-v0.9.0.zip')) { |archive| archive.each { |entry| entry.extract(File.join(ENV.fetch('STARTER_OUTPUT'), 'extracted', entry.name)) } }"
      - name: Initialize a private product workspace
        working-directory: ${{ runner.temp }}/nomotect-starter/extracted/nomotect-starter-v0.9.0
        run: ruby bin/nomotect-init.rb --product-name "Starter Fixture" --organization "NomoTect CI" --repository starter-fixture
      - name: Reject repeated initialization
        working-directory: ${{ runner.temp }}/nomotect-starter/extracted/nomotect-starter-v0.9.0
        shell: bash
        run: '! ruby bin/nomotect-init.rb --product-name "Starter Fixture" --organization "NomoTect CI" --repository starter-fixture'
      - name: Certify MCP bootstrap from the initialized starter
        working-directory: ${{ runner.temp }}/nomotect-starter/extracted/nomotect-starter-v0.9.0
        run: ruby bin/mcp-setup-certify
