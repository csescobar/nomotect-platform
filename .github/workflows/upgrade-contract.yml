name: Upgrade contract

on:
  pull_request:
    paths:
      - app/services/upgrades/**
      - test/services/upgrades/**
      - docs/contracts/upgrade-*.schema.json
      - docs/contracts/installed-platform-state.schema.json
      - docs/contracts/backup-evidence.schema.json
      - docs/upgrades/**
      - config/ai/contracts/upgrades.yml
      - bin/upgrade
      - bin/upgrade-maintenance
      - bin/upgrade-contract-certify
      - .github/workflows/upgrade-contract.yml
  push:
    branches: [main]
    paths:
      - app/services/upgrades/**
      - test/services/upgrades/**
      - docs/contracts/upgrade-*.schema.json
      - docs/contracts/installed-platform-state.schema.json
      - docs/contracts/backup-evidence.schema.json
      - docs/upgrades/**
      - config/ai/contracts/upgrades.yml
      - bin/upgrade
      - bin/upgrade-maintenance
      - bin/upgrade-contract-certify
      - .github/workflows/upgrade-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rails_hotwire_platform_test
      SECRET_KEY_BASE: ci-secret-key-base
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rails_hotwire_platform_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Prepare database
        run: ruby bin/rails db:prepare
      - name: Certify upgrade contracts
        run: bash bin/upgrade-contract-certify
