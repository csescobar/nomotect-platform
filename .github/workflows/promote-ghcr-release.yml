name: Promote GHCR Release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Approved main commit from the distribution manifest
        required: true
        type: string
      image_digest:
        description: Existing commit-addressable multi-platform image digest
        required: true
        type: string
      artifact_run_id:
        description: Successful workflow run containing distribution-bundle
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: promote-ghcr-release
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    env:
      DISTRIBUTION_APPROVED: "true"
      DISTRIBUTION_SOURCE_COMMIT: ${{ inputs.source_commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Verify source is current main
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          git fetch origin main
          test "$SOURCE_COMMIT" = "$(git rev-parse origin/main)"
          test "$SOURCE_COMMIT" = "$(git rev-parse HEAD)"
      - name: Verify and download distribution bundle
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          run_path="repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}"
          test "$(gh api "$run_path" --jq .head_sha)" = "$SOURCE_COMMIT"
          test "$(gh api "$run_path" --jq .head_branch)" = "main"
          test "$(gh api "$run_path" --jq .conclusion)" = "success"
          test "$(gh api "$run_path" --jq .name)" = "Prepare Distribution"
          test "$(gh api "$run_path" --jq .event)" = "workflow_dispatch"
          mkdir -p tmp/distribution
          gh run download "$ARTIFACT_RUN_ID" \
            --name distribution-bundle \
            --dir tmp/distribution
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote existing image manifest
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          bundle exec ruby bin/ghcr-promote apply \
            --manifest tmp/distribution/distribution-manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            --digest "$IMAGE_DIGEST"
