name: Release contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - VERSION
      - changes/**
      - app/services/releases/**
      - lib/platform/version.rb
      - config/ai/contracts/releases.yml
      - config/ai/playbooks/release_readiness.yml
      - config/ai/schemas/playbook.schema.json
      - docs/contracts/change-fragment.schema.json
      - docs/contracts/release-metadata.schema.json
      - docs/contracts/release-compatibility.schema.json
      - docs/contracts/release-evidence.schema.json
      - docs/releases/**
      - bin/release-contract-certify
      - bin/release
      - bin/release-consistency
      - bin/release-framework-certify
      - bin/release-notes
      - bin/release-provenance
      - CHANGELOG.md
      - .github/workflows/prepare-release.yml
      - .github/workflows/release-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nomotect_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nomotect_test
      SECRET_KEY_BASE: ci-secret-key-base
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Prepare database
        run: ruby bin/rails db:prepare
      - run: bash bin/release-contract-certify
      - name: Validate pull request release impact
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          CHANGE_BASE="origin/$BASE_REF" bundle exec ruby bin/change-fragment-validate
