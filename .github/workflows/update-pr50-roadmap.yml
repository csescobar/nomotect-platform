name: Update PR50 roadmap

on:
  pull_request:
    paths:
      - .github/workflows/update-pr50-roadmap.yml

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Record upgrade contract foundation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/roadmap/roadmap.md')
          text = path.read_text()
          text = text.replace(
              '- [ ] Define shared compatibility, migration and deprecation rules for installation, deployment and upgrade contract versions.',
              '- [x] Define shared compatibility, migration and deprecation rules for installation, deployment and upgrade contract versions.'
          )
          text = text.replace(
              '- [ ] Versioned upgrade manifests and compatibility checks.',
              '- [x] Versioned upgrade manifests and compatibility checks.'
          )
          text = text.replace(
              '- [ ] Produce rollback or forward-recovery guidance.\n\n### Phase 4',
              '- [ ] Produce rollback or forward-recovery guidance.\n\n**Delivery evidence:** PR #50 adds the versioned upgrade-manifest and upgrade-history contracts, strict compatibility planning, architecture policy, tests and CI certification.\n\n### Phase 4'
          )
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/roadmap.md
          git commit -m "docs: record upgrade contract foundation"
          git push origin HEAD:${{ github.head_ref }}
