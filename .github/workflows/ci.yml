name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rails_hotwire_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rails_hotwire_platform_test
      SECRET_KEY_BASE: ci-secret-key-base

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare database
        run: ruby bin/rails db:prepare

      - name: Lint
        run: bash bin/lint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubocop-report
          path: tmp/rubocop.txt
          if-no-files-found: ignore

      - name: Security analysis
        run: bash bin/security

      - name: Generate SBOM and checksum
        if: always()
        run: ruby bin/sbom

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: |
            tmp/ci/brakeman.json
            tmp/ci/sbom.cdx.json
            tmp/ci/sbom.cdx.json.sha256
          if-no-files-found: error

      - name: Test
        run: bash bin/test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tmp/ci/test-report.txt
          if-no-files-found: ignore
