name: Distribution contract

on:
  pull_request:
    paths:
      - app/services/distributions/**
      - test/services/distributions/**
      - docs/contracts/distribution-manifest.schema.json
      - docs/contracts/publication-evidence.schema.json
      - docs/contracts/channel-state.schema.json
      - docs/distribution/**
      - docs/decisions/0014-supported-distribution-channels.md
      - config/ai/contracts/distributions.yml
      - bin/distribution-contract-certify
      - bin/distribution
      - bin/github-release-publish
      - bin/ghcr-promote
      - bin/distribution-verify
      - bin/release
      - .github/workflows/publish-github-release.yml
      - .github/workflows/promote-ghcr-release.yml
      - .github/workflows/verify-distribution.yml
      - .github/workflows/distribution-contract.yml
  push:
    branches: [main]
    paths:
      - app/services/distributions/**
      - test/services/distributions/**
      - docs/contracts/distribution-manifest.schema.json
      - docs/contracts/publication-evidence.schema.json
      - docs/contracts/channel-state.schema.json
      - docs/distribution/**
      - docs/decisions/0014-supported-distribution-channels.md
      - config/ai/contracts/distributions.yml
      - bin/distribution-contract-certify
      - bin/distribution
      - bin/github-release-publish
      - bin/ghcr-promote
      - bin/distribution-verify
      - bin/release
      - .github/workflows/publish-github-release.yml
      - .github/workflows/promote-ghcr-release.yml
      - .github/workflows/verify-distribution.yml
      - .github/workflows/distribution-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rails_hotwire_platform_test
      SECRET_KEY_BASE: ci-secret-key-base
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rails_hotwire_platform_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Prepare database
        run: ruby bin/rails db:prepare
      - name: Certify distribution contracts
        run: bash bin/distribution-contract-certify
