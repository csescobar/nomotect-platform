name: Extension contract

on:
  pull_request:
    paths:
      - app/services/extensions/**
      - app/controllers/concerns/extension_gate.rb
      - app/controllers/health_controller.rb
      - test/services/extensions/**
      - test/support/extension_package_helper.rb
      - test/integration/extension_framework_certification_test.rb
      - test/support/extension_fixtures/**
      - docs/contracts/extension-*.schema.json
      - docs/contracts/installed-platform-state.schema.json
      - docs/extensions/**
      - docs/decisions/0013-enterprise-extension-boundaries.md
      - config/ai/contracts/extensions.yml
      - config/ai/playbooks/extension_readiness.yml
      - config/extensions.yml
      - config/initializers/extensions.rb
      - bin/extensions
      - bin/extension-contract-certify
      - .github/workflows/extension-contract.yml
  push:
    branches: [main]
    paths:
      - app/services/extensions/**
      - app/controllers/concerns/extension_gate.rb
      - app/controllers/health_controller.rb
      - test/services/extensions/**
      - test/support/extension_package_helper.rb
      - test/integration/extension_framework_certification_test.rb
      - test/support/extension_fixtures/**
      - docs/contracts/extension-*.schema.json
      - docs/contracts/installed-platform-state.schema.json
      - docs/extensions/**
      - docs/decisions/0013-enterprise-extension-boundaries.md
      - config/ai/contracts/extensions.yml
      - config/ai/playbooks/extension_readiness.yml
      - config/extensions.yml
      - config/initializers/extensions.rb
      - bin/extensions
      - bin/extension-contract-certify
      - .github/workflows/extension-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nomotect_test
      SECRET_KEY_BASE: ci-secret-key-base
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nomotect_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Prepare database
        run: ruby bin/rails db:prepare
      - name: Certify extension contracts
        run: bash bin/extension-contract-certify
