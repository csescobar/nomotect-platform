name: Container publication contract

on:
  pull_request:
    paths:
      - Dockerfile
      - bin/container-publication-validate
      - bin/package-certify
      - bin/packaging-manifest
      - bin/kamal-validate
      - config/deploy.yml
      - .github/workflows/publish-container.yml
      - .github/workflows/container-publication-contract.yml
      - docs/deployment/container-registry.md
      - docs/deployment/kamal.md
  push:
    branches: [main]
    paths:
      - Dockerfile
      - bin/container-publication-validate
      - bin/package-certify
      - bin/packaging-manifest
      - bin/kamal-validate
      - config/deploy.yml
      - .github/workflows/publish-container.yml
      - .github/workflows/container-publication-contract.yml
      - docs/deployment/container-registry.md
      - docs/deployment/kamal.md

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate publication workflow and repository portability
        run: bash bin/container-publication-validate
