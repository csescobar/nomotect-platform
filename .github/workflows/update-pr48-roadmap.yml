name: Update PR48 roadmap

on:
  pull_request:
    paths:
      - .github/workflows/update-pr48-roadmap.yml

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Update Phase 2 traceability
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/roadmap/roadmap.md')
          text = path.read_text()
          text = text.replace('- [ ] Keep packaging outputs reproducible and linked to source, SBOM and provenance metadata.', '- [x] Keep packaging outputs reproducible and linked to source, SBOM and provenance metadata.')
          text = text.replace('PR #47 adds private VPS operational preflight and the Render.com Blueprint profile.', 'PR #47 added private VPS operational preflight and the Render.com Blueprint profile; PR #48 adds the committed dependency lock and reproducible OCI packaging certification.')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/roadmap.md
          git commit -m "docs: record reproducible packaging delivery"
          git push origin HEAD:${{ github.head_ref }}
