name: Verify Distribution

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Approved main commit
        required: true
        type: string
      evidence_run_id:
        description: Workflow run containing distribution-verification-input
        required: true
        type: string
      image_digest:
        description: Published immutable GHCR digest
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - name: Verify approved main source
        env:
          APPROVED_COMMIT: ${{ inputs.source_commit }}
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin main
          test "$APPROVED_COMMIT" = "$DISPATCH_COMMIT"
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
          test "$(git rev-parse origin/main)" = "$APPROVED_COMMIT"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Verify evidence run identity
        env:
          APPROVED_COMMIT: ${{ inputs.source_commit }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN_ID")"
          test "$(jq -r .head_sha <<<"$run_json")" = "$APPROVED_COMMIT"
          test "$(jq -r .head_branch <<<"$run_json")" = "main"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .name <<<"$run_json")" = "Observe Distribution"
          test "$(jq -r .event <<<"$run_json")" = "workflow_dispatch"
      - name: Download credential-free verification input
        run: |
          mkdir -p tmp/distribution
          gh run download "$EVIDENCE_RUN_ID" \
            --name distribution-verification-input \
            --dir tmp/distribution
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
      - name: Verify canonical publication evidence
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          bundle exec ruby bin/distribution-verify \
            --manifest tmp/distribution/distribution-manifest.json \
            --artifact-directory tmp/distribution/artifacts \
            --channel-state tmp/distribution/github-release-state.json \
            --channel-state tmp/distribution/ghcr-state.json \
            --repository "$GITHUB_REPOSITORY" \
            --image-digest "$IMAGE_DIGEST" \
            --output tmp/distribution/publication-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-publication-evidence
          path: tmp/distribution/publication-evidence.json
          if-no-files-found: error
