id: release_readiness
version: 1
title: Assess repository readiness for a pre-release
inputs:
  - target_version
steps:
  - regenerate_repository_intelligence
  - validate_contracts_and_playbooks
  - inspect_architecture_and_documentation_drift
  - verify_security_privacy_and_tenant_evidence
  - verify_tests_sbom_and_provenance
  - produce_readiness_report
completion_gate:
  - repository_ready
  - no_unresolved_high_severity_findings
  - generated_artifacts_current
  - final_ci_green
