version: 1
base:
  font.family.sans: Inter, ui-sans-serif, system-ui, sans-serif
  font.family.body: Inter, ui-sans-serif, system-ui, sans-serif
  font.family.heading: Manrope, Inter, ui-sans-serif, system-ui, sans-serif
  font.family.mono: '"JetBrains Mono", "SFMono-Regular", Consolas, monospace'
  font.size.xs: 0.75rem
  font.size.sm: 0.875rem
  font.size.md: 1rem
  font.size.lg: 1.25rem
  font.size.xl: 1.5rem
  font.size.xxl: 1.875rem
  font.weight.regular: "400"
  font.weight.medium: "500"
  font.weight.semibold: "600"
  font.weight.bold: "700"
  line.height.body: "1.5"
  line.height.heading: "1.2"
  line.height.code: "1.45"
  space.xs: 0.25rem
  space.sm: 0.5rem
  space.md: 1rem
  space.lg: 1.5rem
  space.xl: 2rem
  space.xxl: 3rem
  radius.sm: 0.25rem
  radius.md: 0.5rem
  radius.lg: 0.75rem
  radius.full: 9999px
  shadow.sm: 0 1px 2px rgb(15 23 42 / 0.08)
  shadow.md: 0 4px 6px rgb(15 23 42 / 0.10), 0 1px 3px rgb(15 23 42 / 0.08)
  shadow.lg: 0 10px 15px rgb(15 23 42 / 0.12), 0 4px 6px rgb(15 23 42 / 0.08)
  control.height: 2.75rem
  transition.fast: 120ms ease
  transition.medium: 250ms ease
  transition.slow: 400ms ease
themes:
  light:
    color.background: "#f8fafc"
    color.surface: "#ffffff"
    color.surface.subtle: "#f1f5f9"
    color.text: "#0f172a"
    color.text.muted: "#475569"
    color.border: "#cbd5e1"
    color.primary: "#1d4ed8"
    color.primary.hover: "#1e40af"
    color.on-primary: "#ffffff"
    color.focus: "#2563eb"
    color.danger: "#b91c1c"
    color.on-danger: "#ffffff"
    color.success: "#15803d"
    color.on-success: "#ffffff"
    color.warning: "#b45309"
    color.on-warning: "#ffffff"
  dark:
    color.background: "#0f172a"
    color.surface: "#1e293b"
    color.surface.subtle: "#334155"
    color.text: "#f8fafc"
    color.text.muted: "#cbd5e1"
    color.border: "#475569"
    color.primary: "#60a5fa"
    color.primary.hover: "#93c5fd"
    color.on-primary: "#0f172a"
    color.focus: "#93c5fd"
    color.danger: "#fca5a5"
    color.on-danger: "#450a0a"
    color.success: "#86efac"
    color.on-success: "#052e16"
    color.warning: "#fcd34d"
    color.on-warning: "#451a03"
